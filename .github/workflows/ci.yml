name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: glyka
          POSTGRES_PASSWORD: glyka_ci
          POSTGRES_DB: glyka_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U glyka"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://glyka:glyka_ci@localhost:5432/glyka_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Le client Prisma n'est pas créé par « pnpm install » : sans cette étape, typecheck et build échouent.
      - run: pnpm --filter @glyka/api exec prisma generate
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      # L8-09 : les tests d'intégration de la synchronisation tournent sur la VRAIE base PostgreSQL du
      # service ci-dessus (glyka_test) ; ses tables sont créées ici à partir des migrations.
      - run: pnpm --filter @glyka/api exec prisma migrate deploy
      - run: pnpm test
      - run: pnpm build
